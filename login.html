<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pavan Insurance Company</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#005BAC',
                        secondary: '#F58220'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-primary">Welcome Back</h1>
            <p class="mt-4 text-gray-600">Sign in to access your policies, claims, and account details.</p>
        </div>

        <form class="space-y-6">
            <div>
                <label class="block text-gray-700 font-medium">Email</label>
                <input type="email" placeholder="you@example.com" class="w-full mt-3 p-4 border rounded-2xl" />
            </div>

            <div>
                <label class="block text-gray-700 font-medium">Password</label>
                <input type="password" placeholder="Enter your password" class="w-full mt-3 p-4 border rounded-2xl" />
            </div>

            <button class="w-full bg-primary text-white py-4 rounded-2xl font-semibold">Login</button>

            <div class="flex justify-between items-center text-sm text-gray-500">
                <a href="#" class="hover:text-primary">Forgot Password?</a>
                <a href="contact.html" class="hover:text-primary">Contact Support</a>
            </div>
        </form>

        <div class="mt-10 text-center text-gray-600 text-sm">
            Don’t have an account? <a href="contact.html" class="text-primary font-semibold">Get in touch</a>
        </div>
    </div>
</div>

</body>
</html>
